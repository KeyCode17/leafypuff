pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all && git add {staged_files}
    biome:
      root: "apps/web/"
      glob: "*.{ts,tsx,json}"
      run: pnpm exec biome check --write {staged_files} && git add {staged_files}

# git opens the connection to the remote and sends git-receive-pack BEFORE it runs this
# hook -- GIT_TRACE shows the connection two seconds ahead of the hook. A hook that then
# runs for eleven minutes leaves that connection idle until the remote closes it, and the
# push dies writing to a dead socket with SIGPIPE, exit 141, after every check has passed.
# So pre-push stays under three minutes and .github/workflows/ci.yml runs the full matrix,
# including the two feature combinations that used to live here.
#
# Lefthook also skips pre-push commands when it computes no changed push files, and the
# override is a CLI flag (--force) with no config equivalent.
pre-push:
  parallel: false
  commands:
    rust-fmt:
      run: cargo fmt --all --check
    rust-clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    rust-clippy-all-features:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    rust-test-no-default:
      run: cargo test -p leafypuff-core --no-default-features
    rust-layering:
      run: |
        if rg -n 'sea_orm|sea_query|uniffi::(Object|Record|Error)|\bFfi[A-Z]' apps/core/src/domain apps/core/src/application; then
          echo "Adapter and FFI types must not appear in domain/ or application/."
          exit 1
        fi
    secret-logging:
      run: |
        if rg -n 'tracing::(info|warn|error|debug|trace)!\([^)]*\b(password|plain|plaintext|ciphertext|otp_pepper|pepper|refresh_secret|access_token|api_key|resend_api_key|content_key|passphrase|recovery_code|blob)\b' apps/api/src apps/core/src; then
          echo "A log statement names secret material. Log an identifier, never the value."
          exit 1
        fi
        if grep -A1 -E 'derive\([^)]*Debug' apps/api/src/infrastructure/config.rs apps/api/src/application/iam/mint_session.rs apps/api/src/domain/sync/envelope.rs apps/api/src/domain/sync/change_set.rs | grep -E 'pub struct (Config|Session|FieldEnvelope|WrappedKeyRow)\b'; then
          echo "Config, Session, FieldEnvelope and WrappedKeyRow carry secrets or ciphertext. A derived Debug on them is a log."
          exit 1
        fi
    leaked-provider-key:
      run: |
        if git grep -nE 're_[A-Za-z0-9]{8}_[A-Za-z0-9]{20,}' -- . ':!lefthook.yml' ':!.github'; then
          echo "A Resend API key is committed. Rotate it and move it into sops."
          exit 1
        fi
    web-typecheck:
      root: "apps/web/"
      run: pnpm exec tsc --noEmit
    web-lint:
      root: "apps/web/"
      run: pnpm exec biome check .
    no-react-hooks:
      run: |
        if grep -rnE "\buse(State|Effect|Memo|Callback|Ref|Context|Reducer|LayoutEffect|Transition|DeferredValue|Id|SyncExternalStore|Optimistic)\b" apps/web/src; then
          echo "React hooks are banned: use TanStack Query, Store, Form or Router instead."
          exit 1
        fi

commit-msg:
  commands:
    conventional:
      run: |
        grep -qE '^(feat|fix)\([a-z0-9-]+\): [a-z].*[^.]$|^(chore|docs|refactor|test|build|ci|perf|style|revert)(\([a-z0-9-]+\))?: [a-z].*[^.]$' {1} || {
          echo "Commit subject must be Conventional: feat(scope): lowercase imperative, no trailing period."
          exit 1
        }
