[package]
name = "leafypuff-core"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
test-support = []
sqlite = ["dep:sea-orm", "dep:core-migration", "dep:sea-orm-migration"]
ffi = ["sqlite", "dep:uniffi", "dep:tokio"]
ffi-bindgen = ["ffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["ffi-bindgen"]

[dev-dependencies]
core-migration = { path = "migration" }
proptest = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
core-migration = { path = "migration", optional = true }
data-encoding = { workspace = true }
hkdf = { workspace = true }
image = { workspace = true }
kamadak-exif = { workspace = true }
rand = { workspace = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
uuid = { workspace = true }
zeroize = { workspace = true }
