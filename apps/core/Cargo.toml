[package]
name = "leafypuff-core"
version.workspace = true
license.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
test-support = []
sqlite = ["dep:sea-orm", "dep:core-migration", "dep:sea-orm-migration"]
# The archive writer. Only a build that exports links it.
export = ["dep:zip", "dep:serde_json"]
# The sync client is the only reason the device links an http stack. Keeping it behind a feature
# means a build that never syncs does not carry rustls into the .so.
sync = ["sqlite", "dep:reqwest", "dep:serde_json"]
ffi = ["sqlite", "sync", "export", "dep:uniffi", "dep:tokio"]
ffi-bindgen = ["ffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["ffi-bindgen"]

[dev-dependencies]
core-migration = { path = "migration" }
proptest = { workspace = true }
sea-orm = { workspace = true, features = ["sqlx-sqlite"] }
sea-orm-migration = { workspace = true, features = ["sqlx-sqlite"] }
tempfile = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
core-migration = { path = "migration", optional = true }
data-encoding = { workspace = true }
hkdf = { workspace = true }
image = { workspace = true }
kamadak-exif = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, optional = true }
sea-orm = { workspace = true, features = ["sqlx-sqlite"], optional = true }
sea-orm-migration = { workspace = true, features = ["sqlx-sqlite"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
uuid = { workspace = true }
zeroize = { workspace = true }
zip = { workspace = true, optional = true }
