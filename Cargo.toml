[workspace]
resolver = "3"
members = ["apps/core", "apps/core/migration", "apps/api", "apps/api/migration", "apps/api/testing"]

[workspace.package]
version = "0.24.0"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
# No sqlx driver is enabled here on purpose. apps/core ships inside the android .so and needs
# sqlite alone; apps/api needs postgres alone. A driver enabled at the workspace level would be
# linked into both, so each consumer names the one driver it actually opens.
sea-orm = { version = "1", default-features = false, features = ["runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls"] }
tempfile = "3"
uniffi = { version = "0.32.0", features = ["tokio"] }
# "password-hash" is the PHC-string API: it encodes salt and parameters alongside the digest so a
# stored credential stays verifiable after the cost parameters are raised. "zeroize" wipes each
# crate's internal state on drop.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "getrandom", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
blake3 = "1"
sha2 = "0.11"
# "sys_rng" is the operating system entropy source. Key material never comes from a userspace PRNG.
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
data-encoding = "2"
async-trait = "0.1"
# The S3 client is only ever pointed at garage on loopback. default-features off keeps the
# default credential providers, IMDS and the native TLS stack out of the closure.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls"] }
# rt-tokio brings the default async sleep. Without it the client panics on its first request
# with "an async sleep implementation is required for retry to work", at runtime rather than
# at construction. http-1x is what the tokio runtime's body type needs.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "http-1x"] }
aws-credential-types = "1"
aws-smithy-async = { version = "1", features = ["rt-tokio"] }
# Store-only: the archive holds photos that are already compressed, and deflate would
# spend cpu on them for nothing. default-features off keeps bzip2 and zstd out.
zip = { version = "6", default-features = false }
proptest = "1"

# Thin rather than fat LTO. porto has 1.9 GiB of RAM, and a fat-LTO link of the api binary --
# which now pulls the aws sdk and rustls -- killed the nix daemon mid-build. Thin LTO keeps most
# of the size win at a fraction of the peak memory, and the android .so is what the size mattered
# for in the first place.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# argon2 at m=64MiB is unusably slow when built unoptimised; the test gate runs it eleven times.
# blake2 is argon2's inner compression function and carries the same cost.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
